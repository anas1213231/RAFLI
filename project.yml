name: RAFLI
options:
  bundleIdPrefix: com.ucorc
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 3.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: 1
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: com.ucorc.rafli.power
    DEVELOPMENT_TEAM: ""
targets:
  RAFLI:
    type: application
    platform: iOS
    sources:
      - path: RAFLI/Sources
      - RAFLI/Assets.xcassets
    info:
      path: RAFLI/Info.plist
      properties:
        CFBundleDisplayName: ارفعلي
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryUsageDescription: "RAFLI needs access to choose videos you own and prepare them locally."
        NSPhotoLibraryAddUsageDescription: "RAFLI needs permission to save your processed videos."
    settings:
      base:
        PRODUCT_NAME: RAFLI
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  RAFLITests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: RAFLI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  RAFLIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: RAFLI
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  RAFLI:
    build:
      targets:
        RAFLI: all
    test:
      targets: [RAFLITests, RAFLIUITests]
