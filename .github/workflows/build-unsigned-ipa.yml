name: Build RAFLI Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare exact RAFLI logo assets
        run: |
          mkdir -p RAFLI/Assets.xcassets/AppIcon.appiconset
          mkdir -p RAFLI/Assets.xcassets/RAFLILogo.imageset
          base64 -D -i RAFLI/Assets/RAFLILogo.jpg.b64 -o /tmp/rafli-logo.jpg
          sips -s format png /tmp/rafli-logo.jpg --out /tmp/rafli-logo.png >/dev/null
          cp /tmp/rafli-logo.png RAFLI/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          cp /tmp/rafli-logo.png RAFLI/Assets.xcassets/RAFLILogo.imageset/RAFLILogo.png
          cat > RAFLI/Assets.xcassets/RAFLILogo.imageset/Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "RAFLILogo.png",
                "idiom" : "universal",
                "scale" : "1x"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          JSON

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project RAFLI.xcodeproj \
            -scheme RAFLI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r RAFLI_1_1_UNSIGNED.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RAFLI-1.1-UNSIGNED-IPA
          path: RAFLI_1_1_UNSIGNED.ipa
