name: Build RAFLI V5 Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate RAFLI App Icon
        run: |
          mkdir -p RAFLI/Assets.xcassets/AppIcon.appiconset
          cat > /tmp/rafli_icon.swift <<'SWIFT'
          import AppKit

          let size = NSSize(width: 1024, height: 1024)
          let image = NSImage(size: size)
          image.lockFocus()

          let bg = NSBezierPath(roundedRect: NSRect(x: 35, y: 35, width: 954, height: 954), xRadius: 150, yRadius: 150)
          NSGradient(colors: [NSColor(calibratedRed: 0.01, green: 0.18, blue: 0.14, alpha: 1.0), NSColor(calibratedRed: 0.0, green: 0.06, blue: 0.05, alpha: 1.0)])!.draw(in: bg, angle: -45)

          let glow = NSBezierPath(ovalIn: NSRect(x: 260, y: 290, width: 500, height: 500))
          NSColor(calibratedRed: 0.25, green: 1.0, blue: 0.75, alpha: 0.08).setFill()
          glow.fill()

          let circle = NSBezierPath(ovalIn: NSRect(x: 330, y: 435, width: 364, height: 364))
          NSColor(calibratedWhite: 0.90, alpha: 0.14).setFill()
          circle.fill()
          NSColor(calibratedWhite: 0.95, alpha: 0.72).setStroke()
          circle.lineWidth = 16
          circle.stroke()

          let envelope = NSBezierPath()
          envelope.move(to: NSPoint(x: 220, y: 560))
          envelope.line(to: NSPoint(x: 405, y: 395))
          envelope.curve(to: NSPoint(x: 512, y: 350), controlPoint1: NSPoint(x: 445, y: 365), controlPoint2: NSPoint(x: 475, y: 350))
          envelope.curve(to: NSPoint(x: 620, y: 395), controlPoint1: NSPoint(x: 550, y: 350), controlPoint2: NSPoint(x: 585, y: 365))
          envelope.line(to: NSPoint(x: 805, y: 560))
          envelope.line(to: NSPoint(x: 805, y: 305))
          envelope.curve(to: NSPoint(x: 720, y: 205), controlPoint1: NSPoint(x: 805, y: 255), controlPoint2: NSPoint(x: 770, y: 225))
          envelope.curve(to: NSPoint(x: 512, y: 150), controlPoint1: NSPoint(x: 650, y: 180), controlPoint2: NSPoint(x: 575, y: 155))
          envelope.curve(to: NSPoint(x: 305, y: 205), controlPoint1: NSPoint(x: 445, y: 155), controlPoint2: NSPoint(x: 370, y: 180))
          envelope.curve(to: NSPoint(x: 220, y: 305), controlPoint1: NSPoint(x: 255, y: 225), controlPoint2: NSPoint(x: 220, y: 255))
          envelope.close()
          NSColor(calibratedWhite: 0.92, alpha: 0.30).setFill()
          envelope.fill()
          NSColor(calibratedWhite: 0.96, alpha: 0.82).setStroke()
          envelope.lineWidth = 18
          envelope.lineJoinStyle = .round
          envelope.stroke()

          let arrow = NSBezierPath()
          arrow.move(to: NSPoint(x: 512, y: 720))
          arrow.line(to: NSPoint(x: 405, y: 610))
          arrow.line(to: NSPoint(x: 468, y: 610))
          arrow.line(to: NSPoint(x: 468, y: 525))
          arrow.line(to: NSPoint(x: 556, y: 525))
          arrow.line(to: NSPoint(x: 556, y: 610))
          arrow.line(to: NSPoint(x: 620, y: 610))
          arrow.close()
          NSColor(calibratedWhite: 0.97, alpha: 0.83).setFill()
          arrow.fill()
          NSColor(calibratedWhite: 1.0, alpha: 0.90).setStroke()
          arrow.lineWidth = 8
          arrow.stroke()

          let line = NSBezierPath(roundedRect: NSRect(x: 420, y: 470, width: 184, height: 28), xRadius: 14, yRadius: 14)
          NSColor(calibratedWhite: 0.95, alpha: 0.75).setFill()
          line.fill()

          image.unlockFocus()
          guard let tiff = image.tiffRepresentation,
                let rep = NSBitmapImageRep(data: tiff),
                let png = rep.representation(using: .png, properties: [:]) else { exit(1) }
          try png.write(to: URL(fileURLWithPath: "RAFLI/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"))
          SWIFT
          swift /tmp/rafli_icon.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project RAFLI.xcodeproj \
            -scheme RAFLI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package unsigned IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r RAFLI_V5_PREMIUM_UNSIGNED.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RAFLI-V5-PREMIUM-UNSIGNED-IPA
          path: RAFLI_V5_PREMIUM_UNSIGNED.ipa
