name: Build and verify RAFLI

on:
  workflow_dispatch:
  push:
    branches: [main, 'rebuild/**']

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare exact IRFA3LI brand assets
        run: |
          mkdir -p RAFLI/Assets.xcassets/AppIcon.appiconset
          mkdir -p RAFLI/Assets.xcassets/RAFLILogo.imageset
          # Preserve the exact uploaded artwork, including its original white margin.
          # Only format conversion and proportional resolution changes are performed.
          sips -s format png RAFLI/Assets/RAFLILogo.original.jpeg --out /tmp/rafli-logo.png >/dev/null
          sips -z 1024 1024 /tmp/rafli-logo.png --out RAFLI/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png >/dev/null
          sips -z 768 768 /tmp/rafli-logo.png --out RAFLI/Assets.xcassets/RAFLILogo.imageset/RAFLILogo.png >/dev/null

          cat > RAFLI/Assets.xcassets/RAFLILogo.imageset/Contents.json <<'JSON'
          {"images":[{"filename":"RAFLILogo.png","idiom":"universal","scale":"1x"}],"info":{"author":"xcode","version":1}}
          JSON

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project RAFLI.xcodeproj \
            -scheme RAFLI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package latest ارفعلي IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r RAFLI_3.0_${{ github.run_number }}_UNSIGNED.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RAFLI-3.0-${{ github.run_number }}-UNSIGNED
          path: RAFLI_3.0_${{ github.run_number }}_UNSIGNED.ipa

      - name: Test real video pipeline and navigation
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild test -project RAFLI.xcodeproj -scheme RAFLI -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO

      - name: Export test screenshots
        if: always()
        run: |
          if [ -d TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RAFLI-Verification-${{ github.run_number }}
          path: |
            TestResults.xcresult
            screenshots
