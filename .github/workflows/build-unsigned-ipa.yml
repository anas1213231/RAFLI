name: Build IRFA3LI Elite Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare exact IRFA3LI brand assets
        run: |
          mkdir -p RAFLI/Assets.xcassets/AppIcon.appiconset
          mkdir -p RAFLI/Assets.xcassets/RAFLILogo.imageset
          base64 -D -i RAFLI/Assets/RAFLILogo.jpg.b64 -o /tmp/irfa3li-logo.jpg
          # Keep the supplied ارفعلي artwork exactly as-is. No generated icon and no oversized crop.
          sips -s format png /tmp/irfa3li-logo.jpg --out /tmp/irfa3li-logo.png >/dev/null
          sips -z 1024 1024 /tmp/irfa3li-logo.png --out RAFLI/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png >/dev/null
          sips -z 768 768 /tmp/irfa3li-logo.png --out RAFLI/Assets.xcassets/RAFLILogo.imageset/RAFLILogo.png >/dev/null
          cat > RAFLI/Assets.xcassets/RAFLILogo.imageset/Contents.json <<'JSON'
          {"images":[{"filename":"RAFLILogo.png","idiom":"universal","scale":"1x"}],"info":{"author":"xcode","version":1}}
          JSON

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project RAFLI.xcodeproj \
            -scheme RAFLI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package latest ارفعلي IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r IRFA3LI_LATEST_UNSIGNED.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: IRFA3LI-LATEST
          path: IRFA3LI_LATEST_UNSIGNED.ipa
